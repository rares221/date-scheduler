<app-ambient-bg />
<app-fx-layer />
<app-gate />
<app-video-bg />
<app-now-playing />

<main class="app">
  @switch (state.screen()) {
    @case ('ask') {
      <section class="screen active" data-screen="ask"><app-story />
        <app-question /></section>
    }
    @case ('activity') {
      <section class="screen active" data-screen="activity"><app-activity-step /></section>
    }
    @case ('when') {
      <section class="screen active" data-screen="when"><app-when-step /></section>
    }
    @case ('done') {
      <section class="screen active" data-screen="done"><app-done-step /></section>
    }
  }
</main>
